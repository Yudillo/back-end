# 로컬 개발용 Postgres. DB 서버를 따로 운영한다면 이 파일은 로컬 확인용으로만 쓰면 된다.
#   docker compose up -d
#   docker compose down        (데이터 유지)
#   docker compose down -v     (데이터까지 삭제)
services:
  postgres:
    image: postgres:17-alpine
    container_name: yudillo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yudillo
      POSTGRES_USER: yudillo
      POSTGRES_PASSWORD: yudillo
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yudillo -d yudillo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
