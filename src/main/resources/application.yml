spring:
  application:
    name: yudillo-api
  profiles:
    default: local

  datasource:
    # DB 가 어느 서버에 있든 이 URL 하나만 바꾸면 된다.
    #   jdbc:postgresql://db.example.com:5432/yudillo
    #   jdbc:mysql://db.example.com:3306/yudillo
    #   jdbc:sqlserver://db.example.com:1433;databaseName=yudillo
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # driver-class-name 은 URL 앞부분(jdbc:postgresql / jdbc:mysql ...)으로 자동 판별된다.
    # 명시하면 DB 를 바꿀 때마다 같이 고쳐야 하므로 비워둔다.
    hikari:
      maximum-pool-size: 10
      # 원격 DB 는 네트워크 지연이 있으므로 로컬(3초)보다 넉넉하게 준다.
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
      # 커넥션이 끊긴 줄 모르고 쓰다 실패하는 것을 막는다. (DB 의 idle timeout 보다 짧게)
      max-lifetime: ${DB_MAX_LIFETIME:1740000}
      keepalive-time: ${DB_KEEPALIVE:300000}

  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 가 관리한다. validate 로 엔티티와 실제 스키마가 어긋나면 기동 시 실패시킨다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    # Jackson 3 부터 날짜는 기본적으로 ISO-8601 문자열로 직렬화된다.
    default-property-inclusion: non_null

server:
  # 서버가 열 포트. 80/443 은 리버스 프록시가 받고 이 앱은 8090 에 두는 것이 보통이다.
  port: ${SERVER_PORT:8090}
  # 어느 네트워크 인터페이스에 바인딩할지.
  #   0.0.0.0   모든 인터페이스 (외부 접속 허용) — 기본값
  #   127.0.0.1 로컬에서만 접속 가능 (리버스 프록시를 같은 장비에 둘 때 권장)
  address: ${SERVER_ADDRESS:0.0.0.0}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

jwt:
  # 반드시 환경변수로 주입. HS256 이므로 최소 32바이트 이상.
  secret: ${JWT_SECRET}
  issuer: yudillo-api
  access-token-validity: 30m
  refresh-token-validity: 14d

app:
  # 응답에 실리는 날짜/시각 표기. 저장은 항상 UTC 이고 여기서 표시 형식만 정한다.
  # pattern 을 iso 로 두면 ISO-8601(2026-09-28T01:38:03.825Z)로 나간다.
  datetime:
    pattern: ${DATETIME_PATTERN:yyyy-MM-dd HH:mm:ss}
    zone: ${DATETIME_ZONE:Asia/Seoul}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.yudillo.api: DEBUG
